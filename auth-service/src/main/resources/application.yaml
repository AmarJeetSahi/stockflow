spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://localhost:3307/stock_flow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: password

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    org.flywaydb: DEBUG